# Category → OpenStreetMap tags (blueprint section 10.1) and Overture taxonomy values.
# `overture` values match any level of a place's taxonomy hierarchy, so "dental_clinic" also
# matches general_dentistry and orthodontics. Browse values with the Overture Explorer.
# Tags are "key=value". Synonyms help suggest the right category for typos or plurals.
dentist:
  label: Dental clinics
  osm_tags: ["amenity=dentist", "healthcare=dentist"]
  overture: ["dental_clinic"]
  synonyms: [dental clinic, dentists, dental]
restaurant:
  label: Restaurants
  osm_tags: ["amenity=restaurant"]
  overture: ["restaurant"]
  synonyms: [restaurants, food, dining]
cafe:
  label: Cafes and coffee shops
  osm_tags: ["amenity=cafe"]
  overture: ["cafe", "coffee_shop"]
  synonyms: [coffee shop, coffee, cafes]
gym:
  label: Gyms and fitness centers
  osm_tags: ["leisure=fitness_centre"]
  overture: ["gym"]
  synonyms: [fitness, fitness center, gyms]
salon:
  label: Hair and beauty salons
  osm_tags: ["shop=hairdresser", "shop=beauty"]
  overture: ["beauty_salon", "hair_salon", "barber"]
  synonyms: [beauty salon, hair salon, barber, salons]
law_firm:
  label: Law offices
  osm_tags: ["office=lawyer"]
  overture: ["attorney_or_law_firm"]
  synonyms: [lawyer, lawyers, attorney, law office]
real_estate:
  label: Real estate agencies
  osm_tags: ["office=estate_agent"]
  overture: ["real_estate_agent"]
  synonyms: [realtor, real estate agency, property]
clinic:
  label: Medical clinics
  osm_tags: ["amenity=clinic", "healthcare=clinic"]
  overture: ["doctors_office", "family_practice", "pediatric_clinic"]
  synonyms: [medical clinic, clinics, doctor]
veterinary:
  label: Veterinary clinics
  osm_tags: ["amenity=veterinary"]
  overture: ["veterinary_care"]
  synonyms: [vet, veterinarian, animal clinic]
hotel:
  label: Hotels
  osm_tags: ["tourism=hotel"]
  overture: ["hotel"]
  synonyms: [hotels, lodging]
accountant:
  label: Accounting offices
  osm_tags: ["office=accountant"]
  overture: ["accountant"]
  synonyms: [accounting, bookkeeping, cpa]
car_repair:
  label: Car repair shops
  osm_tags: ["shop=car_repair"]
  overture: ["automotive_repair", "auto_body_shop"]
  synonyms: [auto repair, mechanic, car service]
