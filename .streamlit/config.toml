# Streamlit settings for app/streamlit_app.py. Read from the folder you launch from (repo root).

# "Harvest ledger": a sage-tinted paper canvas, espresso ink, a dark olive sidebar, and palay
# gold (deepened to ochre for contrast on light paper) as the only accent. Headings in Fraunces,
# a high-contrast serif like an almanac or ledger; text in Geist; data in Geist Mono.
# Finer styling (cards, buttons, paper grain) lives in app/assets/theme.css.
[theme]
base = "light"
primaryColor = "#8f5e0e"
backgroundColor = "#eff1e9"
secondaryBackgroundColor = "#e4e8dc"
textColor = "#221c15"
linkColor = "#8a5a0c"
borderColor = "#d6dbcc"
showWidgetBorder = true
baseRadius = "1rem"
buttonRadius = "full"  # pill buttons
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
# One H1 per page (the page or run name); H2 for sections, kept compact (docs/UI.md).
headingFontSizes = ["2.5rem", "1.2rem", "1.05rem", "0.95rem", "0.9rem", "0.85rem"]
headingFontWeights = [500, 600, 600, 600, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 500
dataframeHeaderBackgroundColor = "#e4e8dc"
dataframeBorderColor = "#d6dbcc"
codeBackgroundColor = "#e4e8dc"
# Semantic colours, earthy so they sit with the palette; status only.
greenColor = "#3f7a4c"
redColor = "#b0473a"
orangeColor = "#b5741a"
blueColor = "#3d6d84"
grayColor = "#8b8f80"

[theme.sidebar]
backgroundColor = "#1f2619"
secondaryBackgroundColor = "#2a3322"
textColor = "#e9eadf"
primaryColor = "#d9a441"
borderColor = "#323c29"
greenColor = "#8fc49b"
redColor = "#e48a7e"
orangeColor = "#e3ad55"
blueColor = "#8db9cf"
grayColor = "#a3a893"

[client]
# Hide the developer toolbar ("Deploy" and friends) from people using the app.
toolbarMode = "minimal"

[browser]
# Don't send Streamlit usage statistics.
gatherUsageStats = false
