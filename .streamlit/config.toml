# Streamlit settings for app/streamlit_app.py. Read from the folder you launch from (repo root).

# "Night harvest": a dark paddy-field canvas with palay gold as the only accent, matching the
# LeadHarvest brand. Green is kept for success states only. Text in Geist, headings in Outfit,
# data in Geist Mono. Finer styling (cards, buttons, background) lives in app/assets/theme.css.
[theme]
base = "dark"
primaryColor = "#e0b04a"
backgroundColor = "#060b08"
secondaryBackgroundColor = "#101b15"
textColor = "#e6ede5"
linkColor = "#e8c06a"
borderColor = "#1a2a21"
showWidgetBorder = true
baseRadius = "1rem"
buttonRadius = "full"  # pill buttons
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
headingFont = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
# One H1 per page (the page or run name); H2 for sections, kept compact (docs/UI.md).
headingFontSizes = ["2.2rem", "1.12rem", "1rem", "0.95rem", "0.9rem", "0.85rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 600
dataframeHeaderBackgroundColor = "#101b15"
dataframeBorderColor = "#1a2a21"
codeBackgroundColor = "#101b15"
# Semantic colours tuned for the dark canvas.
greenColor = "#5fbf83"
redColor = "#ec7d70"
orangeColor = "#e8a94a"
blueColor = "#76b4d6"
grayColor = "#8c9c92"

[theme.sidebar]
backgroundColor = "#040806"
secondaryBackgroundColor = "#101c15"
textColor = "#dfe8de"
primaryColor = "#e0b04a"
borderColor = "#1b2c22"
greenColor = "#5fbf83"
redColor = "#ec7d70"
orangeColor = "#e8a94a"
blueColor = "#76b4d6"
grayColor = "#8c9c92"

[client]
# Hide the developer toolbar ("Deploy" and friends) from people using the app.
toolbarMode = "minimal"

[browser]
# Don't send Streamlit usage statistics.
gatherUsageStats = false
