[project]
name = "leadharvest"
version = "0.3.0"
description = "Find businesses by category and location, enrich them from their own websites, and export clean leads."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
    "gspread>=6.1",
    "httpx>=0.27",
    "lxml>=5.2",
    "openpyxl>=3.1",
    "phonenumbers>=8.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tenacity>=8.3",
    "tldextract>=5.1",
    "typer>=0.12",
]

[project.optional-dependencies]
js = ["playwright>=1.44"]
ui = ["streamlit>=1.36"]

[project.scripts]
leadharvest = "leadharvest.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadharvest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # Typer uses function calls in argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the real network; run with -m live"]
addopts = "-m 'not live'"
