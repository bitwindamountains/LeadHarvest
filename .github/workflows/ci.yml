name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (with js + ui extras)
        run: uv sync --locked --all-extras --python 3.12
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: uv run playwright install chromium
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (offline)
        run: uv run pytest -q --cov=leadharvest --cov-report=term-missing:skip-covered
